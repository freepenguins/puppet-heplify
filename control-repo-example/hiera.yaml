---
# Example environment-level hiera.yaml. If you already have one, you only need
# the data files; the heplify:: keys work in any hierarchy level.
version: 5

defaults:
  datadir: data
  data_hash: yaml_data

hierarchy:
  - name: Per-node data
    path: "nodes/%{trusted.certname}.yaml"
  - name: Common data
    path: common.yaml
