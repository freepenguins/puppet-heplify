---
# Per-node overrides: rename this file to the node's certname.

# Capture on one NIC instead of all of them (avoids seeing the same packet
# twice on bridged or bonded hosts).
heplify::interface: eth0

# Non-standard SIP ports on this box.
heplify::sip_port_min: 5060
heplify::sip_port_max: 5080

# Keep keepalive noise out of HOMER.
heplify::discard_methods:
  - OPTIONS

heplify::node_name: sip01
heplify::node_id: 2101

# Anything in heplify.json that has no dedicated parameter goes here and is
# deep-merged over the generated config. Example: Prometheus metrics.
heplify::config_overrides:
  prometheus_settings:
    active: true
    host: 127.0.0.1
    port: 9096
