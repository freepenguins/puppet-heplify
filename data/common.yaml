---
# Defaults for every heplify class parameter. Override any key in your own
# Hiera. Out of the box: capture SIP on every interface and send HEPv3 over
# UDP to a heplify-server on the same host (its default HEPAddr is
# 0.0.0.0:9060).

# --- install ---------------------------------------------------------------
heplify::version: '2.0.28'
heplify::install_method: binary
heplify::download_base_url: 'https://github.com/sipcapture/heplify/releases/download'
# Upstream publishes no checksum files; these were computed from the release
# assets. Add an entry here (or in your Hiera) for each version you deploy.
heplify::checksums:
  '2.0.28':
    amd64: 'c91927c793248f153bd07725a39b94145ef893a364d3029e64f4e1f9769a2faa'
    arm64: '19783aa73964082ae9b94a6ef893c457289ad122fe44f605e194478177522151'
heplify::checksum: ~
heplify::package_name: heplify
heplify::install_dir: /opt/heplify
heplify::bin_path: /usr/local/bin/heplify
heplify::config_dir: /etc/heplify

# --- capture ---------------------------------------------------------------
heplify::interface: any
heplify::socket_type: afpacket
heplify::promisc: true
heplify::capture_mode:
  - SIP
heplify::sip_port_min: 5060
heplify::sip_port_max: 5090
heplify::tcp_reassembly: true
heplify::sip_reassembly: false
heplify::ip_defrag: true
heplify::vlan: false
heplify::bpf_filter: ''

# --- HEP destination -------------------------------------------------------
heplify::hep_host: 127.0.0.1
heplify::hep_port: 9060
heplify::hep_transport: udp
heplify::hep_password: ''
heplify::node_name: "%{facts.networking.hostname}"
heplify::node_id: 2002

# --- filtering and logging -------------------------------------------------
heplify::deduplicate: false
heplify::discard_methods: []
heplify::log_level: info
heplify::config_overrides: {}

# --- service ---------------------------------------------------------------
heplify::manage_service: true
heplify::service_name: heplify
heplify::service_ensure: running
heplify::service_enable: true
heplify::after_units:
  - heplify-server.service

# --- heplify-server (class heplify::server) --------------------------------
heplify::server::version: '1.60.1'
heplify::server::install_method: binary
heplify::server::download_base_url: 'https://github.com/sipcapture/heplify-server/releases/download'
# Computed from the v1.60.1 release assets, like the agent checksums above.
heplify::server::checksums:
  '1.60.1':
    amd64: '6077a620cbcb13791fac06f9a3d30379fa088e4b1b87dbdde4b4dc001ba808b0'
    arm64: 'a0b66f0b02b529bf10bc4b193ea36fc02ee7a10e13239537c55ecf950f769d77'
heplify::server::checksum: ~
heplify::server::package_name: heplify-server
heplify::server::install_dir: /opt/heplify-server
heplify::server::bin_path: /usr/local/bin/heplify-server
heplify::server::config_file: /etc/heplify-server.toml
heplify::server::manage_user: true
heplify::server::user: heplify-server
heplify::server::group: heplify-server
# heplify-server setting names. Anything not listed uses heplify-server's
# built-in default, so settings whose built-in default is wrong for HOMER 7
# (database driver, schema, config table, Prometheus listener) are set here.
heplify::server::settings:
  HEPAddr: '0.0.0.0:9060'
  HEPTCPAddr: ''
  HEPTLSAddr: ''
  HEPWSAddr: ''
  PromAddr: ''
  DBShema: homer7
  DBDriver: postgres
  DBAddr: 'localhost:5432'
  DBUser: homer
  DBDataTable: homer_data
  DBConfTable: homer_config
  DBRotate: true
  DBDropDays: 14
  LogLvl: info
  LogStd: true
  LogSys: false
heplify::server::db_password: ''
heplify::server::allow_db_superuser: false
heplify::server::manage_service: true
heplify::server::service_name: heplify-server
heplify::server::service_ensure: running
heplify::server::service_enable: true
heplify::server::after_units:
  - postgresql.service

lookup_options:
  heplify::checksums:
    merge:
      strategy: deep
  heplify::config_overrides:
    merge:
      strategy: deep
  heplify::hep_password:
    convert_to: Sensitive
  heplify::server::checksums:
    merge:
      strategy: deep
  heplify::server::settings:
    merge:
      strategy: deep
  heplify::server::db_password:
    convert_to: Sensitive
